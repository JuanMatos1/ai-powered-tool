services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: hirelens-scanner:${APP_VERSION:-0.0.1}
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    restart: unless-stopped
